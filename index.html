<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>中考倒计时 · 高级设置</title>

<style>
.title-num {
    font-family: var(--num-font);
}

:root {
    --text-font: "SimSun", serif;
    --num-font: "Times New Roman", serif;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffffff;
    font-family: var(--text-font);
    position: relative;
}

/* 设置图标 */
.setting-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #f2f2f2;
    border: none;
    cursor: pointer;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.setting-btn:hover {
    background: #ddd;
}

/* 设置面板 */
.panel {
    position: fixed;
    top: 70px;
    right: 20px;
    width: 320px;
    background: #fff;
    border: 1px solid #ccc;
    box-shadow: 0 8px 30px rgba(0,0,0,.15);
    padding: 20px;
    display: none;
    z-index: 999;
}
.panel.show {
    display: block;
}
.panel h3 {
    margin: 0 0 12px;
    font-size: 18px;
}
.panel label {
    display: block;
    margin-top: 12px;
    font-size: 14px;
}
.panel input[type="text"] {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
}
.panel button {
    margin-top: 15px;
    padding: 8px 16px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    width: 100%;
}
.panel button:hover {
    background: #45a049;
}

/* 倒计时主体 */
.container {
    text-align: center;
}
.title {
    font-size: 42px;
    font-weight: normal;
    margin-bottom: 40px;
    font-family: var(--text-font);
}
.time {
    display: flex;
    justify-content: center;
    gap: 25px;
}
.block {
    text-align: center;
}
.num {
    font-size: 72px;
    color: #ff0000;
    font-weight: normal;
    min-width: 100px;
    font-family: var(--num-font);
}
.label {
    font-size: 22px;
    margin-top: 8px;
    font-family: var(--text-font);
}
</style>
</head>

<body>

<!-- ⚙️ 设置图标 -->
<button class="setting-btn" onclick="togglePanel()">⚙️</button>

<!-- 设置面板 -->
<div class="panel" id="panel">
    <h3>字体设置</h3>

    <label>
        文字字体 URL
        <input type="text" id="textFontUrl" placeholder="https://raw.githubusercontent.com/LisongQ/x1y2z3assetsSggdhxu/main/AAAAAAAAAAA">
    </label>

    <label>
        数字字体 URL
        <input type="text" id="numFontUrl" placeholder="https://raw.githubusercontent.com/LisongQ/x1y2z3assetsSggdhxu/main/BBBBBBBBBB.ttf">
    </label>

    <button onclick="applyFonts()">应用字体</button>
</div>

<!-- 倒计时 -->
<div class="container">
    <div class="title">距离中考（6 月 20 日）仅剩</div>
    <div class="time">
        <div class="block"><div class="num" id="d">00</div><div class="label">天</div></div>
        <div class="block"><div class="num" id="h">00</div><div class="label">时</div></div>
        <div class="block"><div class="num" id="m">00</div><div class="label">分</div></div>
        <div class="block"><div class="num" id="s">00</div><div class="label">秒</div></div>
    </div>
</div>

<script>
const target = new Date("2026-06-20T00:00:00");

function updateTime() {
    const now = new Date();
    const diff = target - now;
    if (diff <= 0) {
        document.querySelector(".time").innerHTML = "<div style='font-size:48px;color:red;'>中考已开始！</div>";
        return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById("d").innerText = String(d).padStart(2,"0");
    document.getElementById("h").innerText = String(h).padStart(2,"0");
    document.getElementById("m").innerText = String(m).padStart(2,"0");
    document.getElementById("s").innerText = String(s).padStart(2,"0");
}
updateTime();
setInterval(updateTime, 1000);

/* 面板显示/隐藏 */
function togglePanel() {
    panel.classList.toggle("show");
}

/* 应用字体 */
function applyFonts() {
    const textUrl = document.getElementById('textFontUrl').value.trim();
    const numUrl = document.getElementById('numFontUrl').value.trim();
    
    if (textUrl) {
        loadFont(textUrl, 'text');
    }
    if (numUrl) {
        loadFont(numUrl, 'num');
    }
    
    // 关闭面板
    panel.classList.remove('show');
}

/* 字体加载 */
function loadFont(url, type) {
    const name = type === "text" ? "TextFont" : "NumFont";
    let style = document.getElementById(name);
    if (!style) {
        style = document.createElement("style");
        style.id = name;
        document.head.appendChild(style);
    }
    style.textContent = `@font-face{font-family:'${name}';src:url(${url});}`;
    document.documentElement.style.setProperty(
        type === "text" ? "--text-font" : "--num-font",
        `'${name}'`
    );
}

/* 让标题里的数字也用数字字体 */
document.addEventListener("DOMContentLoaded", () => {
    const title = document.querySelector(".title");
    if (title) {
        title.innerHTML = title.innerHTML
            .replace(/\d+/g, '<span class="title-num">$&</span>');
    }
});
</script>

</body>
</html>
